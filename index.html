<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Backtest">
<title>Backtest Chart</title>
<style>
/* Layout: header (coin, replay, menu), timeframe chips, chart canvas with tool strip (bottom on phones, left on wide screens), replay bar. */
:root{
  --bg:#eef1f4; --panel:#ffffff; --line:#d7dee3; --ink:#0f1a22; --mute:#5b6b75;
  --accent:#0b63d1; --on-accent:#ffffff; --up:#0e9f6e; --down:#e0443e; --grid:#ebeff2; --cross:#5b6b75; --warn:#b3261e;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0a0f14; --panel:#10171e; --line:#232f39; --ink:#e6ecf0; --mute:#8b99a4;
    --accent:#5aa7ff; --on-accent:#06121f; --up:#26c58f; --down:#ff6b64; --grid:#161f27; --cross:#8b99a4; --warn:#ff7b72;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:400 14px/1.35 var(--sans);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font-family:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i .f{fill:currentColor;stroke:none}

.top{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.sym{display:flex;align-items:baseline;gap:2px;height:38px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:700 16px var(--mono);cursor:pointer;align-items:center}
.sym small{font:500 12px var(--sans);color:var(--mute)}
.sym svg{margin-left:4px;width:16px;height:16px}
.spacer{flex:1}
.btn{height:38px;min-width:38px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:600 13px var(--sans);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.btn[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.tfs{display:flex;gap:4px;padding:6px 10px;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line);scrollbar-width:none}
.tfs::-webkit-scrollbar{display:none}
.tf{flex:none;height:32px;min-width:42px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--mute);font:600 13px var(--mono);cursor:pointer}
.tf[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}

.body{flex:1;min-height:0;display:flex;flex-direction:column}
.chartwrap{position:relative;flex:1;min-height:0;background:var(--panel)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.tools{order:2;display:flex;gap:2px;overflow-x:auto;padding:4px 6px;background:var(--panel);border-top:1px solid var(--line);scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tool{flex:none;width:54px;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;border-radius:10px;background:transparent;color:var(--mute);font:600 10px var(--sans);cursor:pointer}
.tool[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.tool:disabled{opacity:.35;cursor:default}
.sep{flex:none;width:1px;background:var(--line);margin:6px 4px}
@media (min-width:820px){
  .body{flex-direction:row}
  .tools{order:0;flex-direction:column;width:64px;overflow-y:auto;overflow-x:hidden;border-top:0;border-right:1px solid var(--line);align-items:center}
  .sep{width:36px;height:1px;margin:4px 0}
}

.legend{position:absolute;left:8px;top:6px;right:90px;pointer-events:none;display:flex;flex-direction:column;gap:2px;text-shadow:0 0 3px var(--panel),0 0 3px var(--panel),0 0 3px var(--panel)}
.legend .l1{font:700 13px var(--sans)}
.legend .l1 span{color:var(--mute);font-weight:500}
.legend .l2{display:flex;flex-wrap:wrap;gap:0 10px;font:500 12px var(--mono)}
.legend .l2 b{color:var(--mute);font-weight:500;margin-right:3px}

.float{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;padding:6px 8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.2);max-width:calc(100% - 16px);z-index:3}
.float[hidden]{display:none}
#selbar{top:54px}
#banner{top:54px;flex-wrap:wrap;justify-content:center;text-align:center}
#banner span{font-weight:600;font-size:13px;width:100%}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);padding:0;cursor:pointer}
.sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--ink)}
.wd{width:34px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.wd i{display:block;width:20px;background:var(--ink);border-radius:2px}
.wd[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.mini{white-space:nowrap;height:30px;min-width:30px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:600 12.5px var(--sans);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.mini.danger{color:var(--warn)}

.sigbar{top:auto;bottom:34px;left:8px;transform:none;max-width:calc(100% - 70px);flex-wrap:wrap;font:600 12.5px var(--sans)}
.sigbar b{font-weight:700}
.sigbar span{color:var(--mute);font-weight:500}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:42px;padding:8px 14px;border-radius:10px;background:var(--ink);color:var(--panel);font:600 13px var(--sans);max-width:calc(100% - 24px);text-align:center;z-index:4;pointer-events:none}
.toast[hidden]{display:none}
.loading{position:absolute;right:76px;top:8px;padding:2px 9px;border-radius:99px;background:var(--bg);color:var(--mute);font:600 11px var(--sans);z-index:2}
.loading[hidden]{display:none}
.autobtn{position:absolute;right:4px;bottom:3px;width:44px;height:22px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--accent);font:700 11px var(--sans);padding:0;z-index:2;cursor:pointer}
.autobtn[hidden]{display:none}

.rbar{background:var(--panel);border-top:1px solid var(--line);padding:6px 10px;display:flex;flex-direction:column;gap:6px}
.rbar[hidden]{display:none}
.rrow{display:flex;gap:6px;align-items:center;justify-content:space-between}
.rinfo span{white-space:nowrap}
.rinfo{display:flex;align-items:center;gap:8px;font:600 12px var(--mono);color:var(--mute);min-width:0}
.chip{padding:2px 9px;border-radius:99px;background:var(--accent);color:var(--on-accent);font:700 11px var(--sans);white-space:nowrap}
select.btn{padding:0 8px;appearance:none;-webkit-appearance:none;text-align:center}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet[hidden]{display:none}
.card{width:100%;max-width:520px;max-height:84%;background:var(--panel);border-radius:16px 16px 0 0;padding:12px;display:flex;flex-direction:column;gap:10px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
@media (min-width:820px){.sheet{align-items:center}.card{border-radius:16px;max-height:78%}}
.row{display:flex;gap:8px;align-items:center}
input[type=search],input[type=datetime-local]{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:0 12px;font:500 16px var(--mono);-webkit-user-select:text;user-select:text}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips .tf{height:30px}
#symList,#menuList{margin:0;padding:0;list-style:none;overflow:auto;flex:1;min-height:80px}
#symList button,#menuList button{width:100%;min-height:46px;display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font:600 15px var(--mono);padding:0 6px;text-align:left;cursor:pointer}
#symList button small{font:500 12px var(--sans);color:var(--mute)}
#menuList button{font:600 15px var(--sans)}
#menuList button small{font:500 12px var(--sans);color:var(--mute)}
.note{color:var(--mute);font-size:13px;padding:8px 4px}
.h{font:700 15px var(--sans);margin:0}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button class="sym" id="symBtn" type="button" aria-label="Choose coin"><span id="symText">BTC</span><small id="symQuote">/USDT</small><svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="spacer"></div>
    <button class="btn" id="replayBtn" type="button" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M11 7L5 12l6 5V7zM19 7l-6 5 6 5V7z"/></svg><span id="replayBtnT">Replay</span></button>
    <button class="btn" id="menuBtn" type="button" aria-label="More"><svg class="i" viewBox="0 0 24 24"><circle class="f" cx="5" cy="12" r="1.6"/><circle class="f" cx="12" cy="12" r="1.6"/><circle class="f" cx="19" cy="12" r="1.6"/></svg></button>
  </header>
  <nav class="tfs" id="tfs" aria-label="Timeframe"></nav>
  <div class="body">
    <aside class="tools" id="tools" aria-label="Tools"></aside>
    <main class="chartwrap" id="wrap">
      <canvas id="cv"></canvas>
      <div class="legend" id="legend"></div>
      <div class="loading" id="loading" hidden>Loading…</div>
      <div class="float" id="selbar" hidden></div>
      <div class="float" id="banner" hidden>
        <span id="bannerT">Tap a candle to start replay</span>
        <button class="mini" id="bFirst" type="button">First candle</button>
        <button class="mini" id="bDate" type="button">Pick date</button>
        <button class="mini" id="bCancel" type="button">Cancel</button>
      </div>
      <div class="float sigbar" id="sigbar" hidden></div>
      <button class="autobtn" id="autoBtn" type="button" hidden>Auto</button>
      <div class="toast" id="toast" hidden></div>
    </main>
  </div>
  <footer class="rbar" id="rbar" hidden>
    <div class="rrow">
      <div class="rinfo"><span class="chip" id="rChip">Replay</span><span id="rTime"></span></div>
      <div class="row"><button class="mini" id="rNew" type="button">Replay again</button><button class="mini danger" id="rEnd" type="button">Go live</button></div>
    </div>
    <div class="rrow">
      <button class="btn" id="rExit" type="button">Exit</button>
      <button class="btn" id="rBack" type="button" aria-label="Step back"><svg class="i" viewBox="0 0 24 24"><path d="M18 5L9 12l9 7zM6 5v14"/></svg></button>
      <button class="btn" id="rPlay" type="button" aria-label="Play"><svg class="i" id="rPlayI" viewBox="0 0 24 24"><path class="f" d="M7 4l13 8-13 8z"/></svg></button>
      <button class="btn" id="rFwd" type="button" aria-label="Step forward"><svg class="i" viewBox="0 0 24 24"><path d="M6 5l9 7-9 7zM18 5v14"/></svg></button>
      <select class="btn" id="rSpeed" aria-label="Speed"><option value="1">1 / s</option><option value="2" selected>2 / s</option><option value="5">5 / s</option><option value="10">10 / s</option><option value="30">30 / s</option></select>
    </div>
  </footer>
</div>

<div class="sheet" id="symSheet" hidden>
  <div class="card">
    <div class="row"><input id="symQ" type="search" placeholder="Search a coin, e.g. SOL" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Search coin"><button class="btn" id="symClose" type="button">Close</button></div>
    <div class="chips" id="quoteChips"></div>
    <ul id="symList"></ul>
  </div>
</div>
<div class="sheet" id="menuSheet" hidden>
  <div class="card"><h2 class="h">Menu</h2><ul id="menuList"></ul><button class="btn" id="menuClose" type="button">Close</button></div>
</div>
<div class="sheet" id="dateSheet" hidden>
  <div class="card">
    <h2 class="h" id="dateTitle">Go to date</h2>
    <input id="dateIn" type="datetime-local" aria-label="Date and time">
    <p class="note" id="dateNote">Your local time.</p>
    <div class="row"><button class="btn" id="dateGo" type="button" aria-pressed="true" style="flex:1">Go</button><button class="btn" id="dateCancel" type="button" style="flex:1">Cancel</button></div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pad = v => String(v).padStart(2, '0');
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

// ---------- Constants ----------
const TFS = [['1m','1',60],['3m','3',180],['5m','5',300],['15m','15',900],['30m','30',1800],['1h','60',3600],['2h','120',7200],
  ['4h','240',14400],['6h','360',21600],['12h','720',43200],['1D','D',86400],['1W','W',604800],['1M','M',2592000]]
  .map(([label, iv, sec]) => ({ label, iv, sec }));
const HOSTS = ['https://api.bytick.com', 'https://api.bybit.com'];
let hostIdx = 0;
const SWATCH = ['#2f81f7', '#e5534b', '#2ea043', '#d29922', '#a371f7', '#8b949e'];
const WIDTHS = [1, 2, 4];
const ONE_PT = new Set(['hline', 'hray', 'vline']);
const TOOL_DEFS = [
  ['cursor', 'Cursor', '<path d="M6 3l12 7-5.5 1.8L10 18z"/>'],
  ['trend', 'Trend', '<circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/><path d="M6.5 17.5L17.5 6.5"/>'],
  ['ray', 'Ray', '<circle cx="5" cy="19" r="2"/><path d="M6.5 17.5L21 3M15.5 3H21v5.5"/>'],
  ['hline', 'H-line', '<path d="M3 12h18"/><circle cx="12" cy="12" r="2"/>'],
  ['hray', 'H-ray', '<circle cx="5" cy="12" r="2"/><path d="M7 12h14M17 8l4 4-4 4"/>'],
  ['vline', 'V-line', '<path d="M12 3v18"/><circle cx="12" cy="12" r="2"/>'],
  ['rect', 'Box', '<rect x="4" y="6" width="16" height="12" rx="1"/>']
];

// ---------- State ----------
let symbol = store.get('bc_symbol', 'BTCUSDT');
let tf = TFS[store.get('bc_tf', 5)] || TFS[5];
let instruments = [], instBySym = {};
let bars = [], n = 0, reachedStart = false, reachedEnd = true, rightCursor = 0;
let epoch = 0, loadingL = false, loadingR = false, busy = 0, prec = 2;
const listingCache = {};
const view = { spacing: 8, right: 0 };
let manual = null;
let pv = { min: 0, max: 1 };
let tool = 'cursor', magnet = store.get('bc_magnet', true);
let drawings = [], sel = null, draft = null, phase = 0;
let undoStack = [], redoStack = [];
const replay = { active: false, levels: [], endT: 0, selecting: false, playing: false, timer: null, speed: 2, pickMode: 'tap' };
let cross = null;
let C = {};
let marks = [], marksOn = true, marksSym = '', sigInfo = null;
const MCOL = { sup: '#2ea043', res: '#e5534b', sh: '#d29922', ev: '#2f81f7', crt: '#a371f7' };

// ---------- Canvas ----------
const cv = $('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, dpr = 1, axisW = 58, timeH = 26, paneW = 0, paneH = 0, dirty = true;
function layout() { paneW = Math.max(10, W - axisW); paneH = Math.max(10, H - timeH); }
function resize() {
  const r = cv.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1; W = r.width; H = r.height;
  cv.width = Math.max(1, Math.round(W * dpr)); cv.height = Math.max(1, Math.round(H * dpr));
  layout(); requestDraw();
}
new ResizeObserver(resize).observe($('wrap'));
function readColors() {
  const cs = getComputedStyle(document.documentElement), v = k => cs.getPropertyValue(k).trim();
  C = { bg: v('--panel'), grid: v('--grid'), ink: v('--ink'), mute: v('--mute'), line: v('--line'), up: v('--up'), down: v('--down'), cross: v('--cross'), accent: v('--accent'), onAccent: v('--on-accent') };
  requestDraw();
}
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors);
function requestDraw() { dirty = true; }
function frame() { if (dirty) { dirty = false; try { draw(); } catch (e) { console.error(e); } } requestAnimationFrame(frame); }

// ---------- Coordinates ----------
const x2l = x => view.right - (paneW - x) / view.spacing;
const l2x = l => paneW - (view.right - l) * view.spacing;
const p2y = p => (pv.max - p) / (pv.max - pv.min) * paneH;
const y2p = y => pv.max - y / paneH * (pv.max - pv.min);
function timeToLogical(t) {
  if (n === 0) return 0;
  const sec = tf.sec;
  if (t >= bars[n - 1].time) return (n - 1) + (t - bars[n - 1].time) / sec;
  if (t <= bars[0].time) return (t - bars[0].time) / sec;
  let lo = 0, hi = n - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (bars[m].time <= t) lo = m; else hi = m; }
  return lo + (t - bars[lo].time) / (bars[lo + 1].time - bars[lo].time);
}
function logicalToTime(l) {
  if (n === 0) return 0;
  if (l >= n - 1) return bars[n - 1].time + (l - (n - 1)) * tf.sec;
  if (l <= 0) return bars[0].time + l * tf.sec;
  const i = Math.floor(l);
  return bars[i].time + (l - i) * (bars[i + 1].time - bars[i].time);
}
const toXY = pt => ({ x: l2x(timeToLogical(pt.t)), y: p2y(pt.p) });

function computePV() {
  if (manual) { pv = { min: manual.min, max: manual.max }; return; }
  const i0 = Math.max(0, Math.floor(x2l(0))), i1 = Math.min(n - 1, Math.ceil(x2l(paneW)));
  let lo = Infinity, hi = -Infinity;
  for (let i = i0; i <= i1; i++) { const b = bars[i]; if (b.low < lo) lo = b.low; if (b.high > hi) hi = b.high; }
  if (!isFinite(lo)) return;
  if (marksOn && marks.length && hi > lo) {
    const r0 = hi - lo, a = lo, b = hi;
    for (const m of marks) {
      if (!segOn(m)) continue;
      if (m.p >= a - r0 * 1.5 && m.p <= b + r0 * 1.5) { if (m.p < lo) lo = m.p; if (m.p > hi) hi = m.p; }
    }
  }
  if (hi <= lo) { const d = Math.abs(hi) * 0.01 || 1; hi += d; lo -= d; }
  const r = hi - lo;
  pv = { min: lo - r * 0.2, max: hi + r * 0.08 };
}
function clampView() {
  const sp = view.spacing;
  view.right = clamp(view.right, 0.4 * paneW / sp, (n - 1) + 0.65 * paneW / sp);
}
function panBy(dx) { view.right -= dx / view.spacing; clampView(); onViewChanged(); }
function zoomAt(x, f) {
  const l = x2l(x);
  view.spacing = clamp(view.spacing * f, 1.2, 70);
  view.right = l + (paneW - x) / view.spacing;
  clampView(); onViewChanged();
}
function resetView() { view.spacing = 8; view.right = (n - 1) + 6; manual = null; clampView(); onViewChanged(); }
let extCheck = 0;
function onViewChanged() {
  requestDraw();
  const now = performance.now(); if (now - extCheck < 80) return; extCheck = now;
  checkExtend();
}
function checkExtend() {
  if (x2l(0) < 40 && !reachedStart) extendLeft();
  if (!replay.active && !reachedEnd && x2l(paneW) > n - 40) extendRight();
}

// ---------- Formatting ----------
const fmtP = (v, d) => (isFinite(v) ? v.toFixed(d === undefined ? prec : d) : '-');
function fmtV(v) { const a = Math.abs(v); return a >= 1e9 ? (v / 1e9).toFixed(2) + 'B' : a >= 1e6 ? (v / 1e6).toFixed(2) + 'M' : a >= 1e3 ? (v / 1e3).toFixed(2) + 'K' : v.toFixed(2); }
const isUTC = () => tf.sec >= 86400;
function parts(t, utc) {
  const d = new Date(t * 1000);
  return utc ? { y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate(), h: d.getUTCHours(), mi: d.getUTCMinutes(), w: d.getUTCDay() }
    : { y: d.getFullYear(), m: d.getMonth(), d: d.getDate(), h: d.getHours(), mi: d.getMinutes(), w: d.getDay() };
}
function fmtFull(t) {
  const u = isUTC(), q = parts(t, u);
  const date = `${DOW[q.w]} ${q.d} ${MON[q.m]} '${String(q.y).slice(2)}`;

  if (replay.levels.length) {
    replay.endT = replay.levels.pop();
    await ensureCoverage(replay.endT);
    n = computeN(); view.right = (n - 1) + Math.max(4, paneW * 0.22 / view.spacing); clampView();
  } else {
    const at = replay.endT - tf.sec;
    replay.active = false; replay.selecting = false; n = computeN();
    view.right = timeToLogical(at) + Math.max(4, paneW * 0.22 / view.spacing); manual = null; clampView();
  }
  renderReplayUI(); checkExtend();
}
async function endReplay() {
  stopPlay(); replay.active = false; replay.levels = []; replay.selecting = false;
  renderReplayUI(); await loadLatest();
}
async function startReplayAtTime(ms) {
  const sec = Math.floor(ms / 1000);
  if (replay.active && sec + tf.sec > replay.endT) { toast('Pick a date before the current replay point'); return; }
  const first = bars.length ? bars[0].time : Infinity;
  const last = bars.length ? bars[bars.length - 1].time + tf.sec : 0;
  if (!(sec >= first && sec < last)) {
    const ok = await loadWindow(sec); if (!ok) return;
  }
  let lo = 0, hi = bars.length - 1, ans = 0;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (bars[m].time <= sec) { ans = m; lo = m + 1; } else hi = m - 1; }
  beginReplay(bars[ans].time + tf.sec, true);
}
async function startReplayFirst() {
  const ok = await loadFirst(); if (!ok) return;
  beginReplay(bars[0].time + tf.sec, true);
}

// ---------- Timeframe / symbol ----------
function buildTfs() {
  $('tfs').innerHTML = TFS.map((t, i) => `<button class="tf" type="button" data-i="${i}" aria-pressed="${t === tf}">${t.label}</button>`).join('');
}
$('tfs').addEventListener('click', e => { const b = e.target.closest('.tf'); if (b) setTF(TFS[+b.dataset.i]); });
async function setTF(t) {
  if (t === tf) return;
  const anchor = replay.active ? replay.endT - 1 : (n ? logicalToTime(clamp(x2l(paneW / 2), 0, n - 1)) : 0);
  const atEnd = !replay.active && n > 0 && view.right >= n - 1 - 2 && reachedEnd;
  stopPlay(); if (draft) cancelDraft();
  tf = t; store.set('bc_tf', TFS.indexOf(t)); buildTfs();
  if (replay.active) { await loadWindow(anchor); n = computeN(); view.right = (n - 1) + Math.max(4, paneW * 0.22 / view.spacing); clampView(); renderReplayUI(); }
  else if (atEnd || !anchor) await loadLatest();
  else { const ok = await loadWindow(anchor); if (ok) { view.right = timeToLogical(anchor) + (paneW / 2) / view.spacing; clampView(); requestDraw(); } }
  checkExtend();
}
async function setSymbol(s) {
  if (s === symbol && bars.length) return;
  stopPlay(); replay.active = false; replay.levels = []; replay.selecting = false; renderReplayUI();
  if (s !== marksSym) { marks = []; sigInfo = null; updateSigBar(); }
  symbol = s; store.set('bc_symbol', s);
  const rec = store.get('bc_recent', []).filter(x => x !== s); rec.unshift(s); store.set('bc_recent', rec.slice(0, 8));
  drawings = store.get('bc_d_' + symbol, []); undoStack = []; redoStack = []; sel = null; draft = null; showSelbar(); updateToolState();
  bars = []; n = 0; applyInstrument();
  await loadLatest();
}

// symbol sheet
let quoteFilter = 'USDT';
function renderSymList() {
  const q = $('symQ').value.trim().toUpperCase();
  const chips = ['USDT', 'USDC', 'BTC', 'ETH', 'All'];
  $('quoteChips').innerHTML = chips.map(c => `<button class="tf" type="button" data-q="${c}" aria-pressed="${c === quoteFilter}">${c}</button>`).join('');
  const ul = $('symList');
  if (!instruments.length) { ul.innerHTML = '<li class="note">Loading coins…</li>'; return; }
  let list = instruments.filter(i => (quoteFilter === 'All' || i.q === quoteFilter));
  if (q) {
    list = list.filter(i => i.s.includes(q) || i.b.includes(q));
    list.sort((a, b) => (b.b === q) - (a.b === q) || (b.b.startsWith(q)) - (a.b.startsWith(q)) || a.s.localeCompare(b.s));
  } else {
    const rec = store.get('bc_recent', []);
    list.sort((a, b) => (rec.indexOf(b.s) >= 0) - (rec.indexOf(a.s) >= 0) || a.s.localeCompare(b.s));
  }
  list = list.slice(0, 120);
  ul.innerHTML = list.length ? list.map(i => `<li><button type="button" data-s="${i.s}"><span>${i.b}<small>/${i.q}</small></span><small>${i.s === symbol ? 'Current' : ''}</small></button></li>`).join('') : '<li class="note">No coin found.</li>';
}
function openSheet(id) { $(id).hidden = false; }
function closeSheet(id) { $(id).hidden = true; }
$('symBtn').addEventListener('click', () => { openSheet('symSheet'); renderSymList(); setTimeout(() => $('symQ').focus(), 50); });
$('symClose').addEventListener('click', () => closeSheet('symSheet'));
$('symQ').addEventListener('input', renderSymList);
$('symQ').addEventListener('keydown', e => { if (e.key === 'Enter') { const b = $('symList').querySelector('button'); if (b) b.click(); } });
$('quoteChips').addEventListener('click', e => { const b = e.target.closest('[data-q]'); if (b) { quoteFilter = b.dataset.q; renderSymList(); } });
$('symList').addEventListener('click', e => { const b = e.target.closest('[data-s]'); if (b) { closeSheet('symSheet'); setSymbol(b.dataset.s); } });
$('symSheet').addEventListener('click', e => { if (e.target === $('symSheet')) closeSheet('symSheet'); });

// date sheet
let dateMode = 'goto';
function openDate(mode) {
  dateMode = mode;
  $('dateTitle').textContent = mode === 'replay' ? 'Start replay at a date' : 'Go to date';
  const d = replay.active && n ? new Date(replay.endT * 1000 - tf.sec * 1000) : new Date();
  $('dateIn').value = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  $('dateNote').textContent = 'Your local time. Dates before the coin was listed jump to its first candle.';
  openSheet('dateSheet');
}
$('dateGo').addEventListener('click', async () => {
  const v = $('dateIn').value; if (!v) return;
  const ms = new Date(v).getTime(); if (!isFinite(ms)) return;
  closeSheet('dateSheet');
  if (dateMode === 'replay') await startReplayAtTime(ms);
  else {
    if (replay.active) { toast('Exit replay first, or use Replay again'); return; }
    const ok = await loadWindow(Math.floor(ms / 1000));
    if (ok) { view.right = timeToLogical(ms / 1000) + (paneW / 2) / view.spacing; clampView(); requestDraw(); }
  }
});
$('dateCancel').addEventListener('click', () => closeSheet('dateSheet'));
$('dateSheet').addEventListener('click', e => { if (e.target === $('dateSheet')) closeSheet('dateSheet'); });

// menu
let clearArmed = false;
function renderMenu() {
  const items = [
    ['goto', 'Go to date', 'Jump the chart to any day'],
    ['first', 'Go to listing day', 'First candle of this coin'],
    ['reload', 'Reload candles', ''],
    ['clear', clearArmed ? 'Tap again to clear all drawings' : 'Clear all drawings on this coin', clearArmed ? '' : drawings.length + ' saved']
  ];
  $('menuList').innerHTML = items.map(([k, t, s]) => `<li><button type="button" data-k="${k}"><span>${t}</span><small>${s}</small></button></li>`).join('');
}
$('menuBtn').addEventListener('click', () => { clearArmed = false; renderMenu(); openSheet('menuSheet'); });
$('menuClose').addEventListener('click', () => closeSheet('menuSheet'));
$('menuSheet').addEventListener('click', async e => {
  if (e.target === $('menuSheet')) { closeSheet('menuSheet'); return; }
  const b = e.target.closest('[data-k]'); if (!b) return;
  const k = b.dataset.k;
  if (k === 'clear') {
    if (!clearArmed) { clearArmed = true; renderMenu(); return; }
    if (drawings.length) pushUndo(); drawings = []; sel = null; saveDrawings(); showSelbar(); requestDraw(); closeSheet('menuSheet'); return;
  }
  closeSheet('menuSheet');
  if (k === 'goto') { if (replay.active) toast('Exit replay first, or use Replay again'); else openDate('goto'); }
  else if (k === 'first') { if (replay.active) toast('Exit replay first'); else { await loadFirst(); } }
  else if (k === 'reload') { if (replay.active) toast('Exit replay first'); else await loadLatest(); }
});

// replay controls
$('replayBtn').addEventListener('click', openPicker);
$('rNew').addEventListener('click', openPicker);
$('bCancel').addEventListener('click', () => { replay.selecting = false; renderReplayUI(); });
$('bFirst').addEventListener('click', () => { replay.selecting = false; renderReplayUI(); startReplayFirst(); });
$('bDate').addEventListener('click', () => { replay.selecting = false; renderReplayUI(); openDate('replay'); });
$('rExit').addEventListener('click', exitReplay);
$('rEnd').addEventListener('click', endReplay);
$('rBack').addEventListener('click', () => { stopPlay(); stepBack(); });
$('rFwd').addEventListener('click', () => { stopPlay(); stepFwd(); renderReplayUI(); });
$('rPlay').addEventListener('click', () => { if (replay.playing) { stopPlay(); renderReplayUI(); } else startPlay(); });
$('rSpeed').addEventListener('change', () => { replay.speed = +$('rSpeed').value; if (replay.playing) startPlay(); });

// keyboard
document.addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
  const k = e.key;
  if (k === 'Escape') { if (draft) cancelDraft(); else if (replay.selecting) openPicker(); else if (tool !== 'cursor') setTool('cursor'); else select(null); }
  else if ((k === 'Delete' || k === 'Backspace') && sel) deleteSel();
  else if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'y') { e.preventDefault(); redo(); }
  else if (replay.active && k === 'ArrowRight') { stopPlay(); stepFwd(); renderReplayUI(); }
  else if (replay.active && k === 'ArrowLeft') { stopPlay(); stepBack(); }
  else if (replay.active && k === ' ') { e.preventDefault(); replay.playing ? (stopPlay(), renderReplayUI()) : startPlay(); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && replay.playing) { stopPlay(); renderReplayUI(); } requestDraw(); });
window.addEventListener('error', e => { toast('Error: ' + (e.message || 'something went wrong'), 4000); });

// ---------- Boot ----------
readColors();
C.upHex = ''; // resolved below
function resolveHex() {
  // volume tint needs hex colours; read the raw token values
  const cs = getComputedStyle(document.documentElement);
  const toHex = s => { s = s.trim(); if (s[0] === '#') return s.length === 4 ? '#' + [...s.slice(1)].map(c => c + c).join('') : s; return '#888888'; };
  C.upHex = toHex(cs.getPropertyValue('--up')); C.downHex = toHex(cs.getPropertyValue('--down'));
}
resolveHex();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readColors(); resolveHex(); });
try {
  const q = new URLSearchParams(location.search).get('sig');
  if (q) {
    const sg = JSON.parse(q);
    if (sg && /^[A-Z0-9]{3,20}$/.test(sg.sym || '')) {
      symbol = sg.sym; marksSym = sg.sym;
      const ti = TFS.findIndex(t => t.iv === String(sg.tf)); if (ti >= 0) tf = TFS[ti];
      marks = cleanMarks(sg.marks); sigInfo = { title: sg.title || '', start: isFinite(sg.start) ? sg.start : 0, hint: String(sg.hint || '').slice(0, 120) };
    }
  }
} catch (e) {}
buildTfs(); buildTools(); updateSigBar();
drawings = store.get('bc_d_' + symbol, []);
applyInstrument(); renderReplayUI(); showSelbar();
resize(); requestAnimationFrame(frame);
loadInstruments();
loadLatest().then(fitMarks);

// handles used by automated tests
window.__bc = {
  get s() { return { symbol, tf: tf.label, n, bars: bars.length, reachedStart, reachedEnd, view: { ...view }, manual, pv: { ...pv }, tool, sel, drawings, draft, replay: { active: replay.active, levels: replay.levels.slice(), endT: replay.endT, selecting: replay.selecting, playing: replay.playing }, paneW, paneH, axisW, W, H, undo: undoStack.length, redo: redoStack.length, magnet, instruments: instruments.length }; },
  bars: () => bars, marks: () => marks, endReplay, setTool, setTF: i => setTF(TFS[i]), setSymbol, x2l, l2x, p2y, y2p, timeToLogical, logicalToTime, toXY, stepFwd, stepBack, exitReplay, startReplayAtTime, startPlay, stopPlay, undo, redo
};
})();
</script>
